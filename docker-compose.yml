services:

    proxy:
        network_mode: host
        image: jonasal/nginx-certbot:6.2.0-nginx1.31.1-alpine
        restart: unless-stopped
        hostname: proxy
        volumes:
            - ${CONFIGDIR}/letsencrypt:/etc/letsencrypt
            - ${CONFIGDIR}/proxy/makeproxy.conf.sh:/docker-entrypoint.d/05-makeconf.sh
        environment:
            - CERTBOT_EMAIL

    spreedbackend:
        network_mode: host
        restart: unless-stopped
        hostname: spreedbackend
        image: ghcr.io/lnobach/nextcloud-spreed-signaling:2.1.1
        volumes:
            - ${CONFIGDIR}/spreedbackend:/config:ro

    nats:
        network_mode: host
        image: nats:2.14.4
        hostname: nats

    janus:
        network_mode: host
        restart: unless-stopped
        hostname: spreedbackend
        image: ghcr.io/lnobach/janus-gateway:1.4.1
        command: ["/entrypoint", "-F", "/config", "-C", "/config/janus.cfg"]
        environment:
            - COPYCERT=/etc/letsencrypt/live/${HOSTFQDN}/fullchain.pem
            - COPYKEY=/etc/letsencrypt/live/${HOSTFQDN}/privkey.pem
        volumes:
            - ${CONFIGDIR}/janus:/config:ro
            - ${CONFIGDIR}/letsencrypt:/etc/letsencrypt:ro

    coturn:
        network_mode: host
        restart: unless-stopped
        hostname: coturn
        image: ghcr.io/lnobach/coturn:4.12.0-alpine
        environment:
            - COPYCERT=/etc/letsencrypt/live/${HOSTFQDN}/fullchain.pem
            - COPYKEY=/etc/letsencrypt/live/${HOSTFQDN}/privkey.pem
        volumes:
            - ${CONFIGDIR}/coturn.conf:/etc/coturn/turnserver.conf:ro
            - ${CONFIGDIR}/letsencrypt:/etc/letsencrypt:ro
        tmpfs:
            - /var/lib/coturn
